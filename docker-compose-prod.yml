version: '3'
services:
  database:
    image: 'postgres:latest'
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # The PostgreSQL user (useful to connect to the database)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # The PostgreSQL password (useful to connect to the database)
      POSTGRES_DB: ${POSTGRES_DB} # The PostgreSQL default database (automatically created at first launch)
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: my_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: 526955697352.dkr.ecr.us-east-1.amazonaws.com/chess/backend:latest
    ports: 
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_PORT: ${BACKEND_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      SECRET_KEY: "SECRET_KEY"
      REDIS_KEY: "REDIS_KEY"
      REDIS_TLS: "false"
      REDIS_DATA_KEY: "data"
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      - redis

  ws:
    image: 526955697352.dkr.ecr.us-east-1.amazonaws.com/chess/ws:latest
    ports: 
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: ${BACKEND_PORT}
      SECRET_KEY: "SECRET_KEY"
      REDIS_KEY: "REDIS_KEY"
      REDIS_DATA_KEY: "data"
      REDIS_TLS: "false"
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
