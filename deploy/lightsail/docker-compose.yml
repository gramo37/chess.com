# Runs on the Lightsail instance from /opt/chess.
# /opt/chess/.env is written by .github/workflows/deploy-lightsail-backend.yml and provides
# ECR_REGISTRY, IMAGE_TAG, DATABASE_URL and SECRET_KEY.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_TLS: "false"
  REDIS_KEY: REDIS_KEY
  REDIS_DATA_KEY: data

services:
  api:
    image: ${ECR_REGISTRY}/chess/backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *redis-env
      BACKEND_PORT: "5000"
      FRONTEND_URL: https://chess.gramo37.in
      ALLOWED_HOSTS: http://localhost:5173,http://localhost:3000,http://localhost,https://chess.gramo37.in
    mem_limit: 300m
    depends_on:
      - redis
    logging: *logging

  ws:
    image: ${ECR_REGISTRY}/chess/ws:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *redis-env
      WEBSOCKET_PORT: "8000"
    mem_limit: 300m
    depends_on:
      - redis
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    mem_limit: 200m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 100m
    depends_on:
      - api
      - ws
    logging: *logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
