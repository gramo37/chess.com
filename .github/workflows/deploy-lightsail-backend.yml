name: Deploy Chess Backend (Lightsail)

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "apps/ws/**"
      - "deploy/lightsail/**"
      - ".github/workflows/deploy-lightsail-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chess-backend-lightsail
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 526955697352.dkr.ecr.us-east-1.amazonaws.com
  API_REPOSITORY: chess/backend
  WS_REPOSITORY: chess/ws
  API_DOMAIN: chess-api.gramo37.in
  SSH_USER: ubuntu
  APP_DIR: /opt/chess

jobs:
  deploy:
    name: Build images and deploy to Lightsail
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API and WebSocket images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          api_image="${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"
          ws_image="${ECR_REGISTRY}/${WS_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --tag "${api_image}" \
            --tag "${ECR_REGISTRY}/${API_REPOSITORY}:latest" \
            apps/backend

          docker build \
            --tag "${ws_image}" \
            --tag "${ECR_REGISTRY}/${WS_REPOSITORY}:latest" \
            apps/ws

          docker push "${api_image}"
          docker push "${ECR_REGISTRY}/${API_REPOSITORY}:latest"
          docker push "${ws_image}"
          docker push "${ECR_REGISTRY}/${WS_REPOSITORY}:latest"

      - name: Configure SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${LIGHTSAIL_SSH_KEY}" > ~/.ssh/id_lightsail
          chmod 600 ~/.ssh/id_lightsail
          ssh-keyscan -H "${LIGHTSAIL_HOST}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host lightsail
            HostName ${LIGHTSAIL_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_lightsail
            IdentitiesOnly yes
          EOF

      - name: Render .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          umask 077
          {
            printf "ECR_REGISTRY='%s'\n" "${ECR_REGISTRY}"
            printf "IMAGE_TAG='%s'\n" "${IMAGE_TAG}"
            printf "DATABASE_URL='%s'\n" "${DATABASE_URL}"
            printf "SECRET_KEY='%s'\n" "${SECRET_KEY}"
          } > deploy/lightsail/.env

      - name: Upload compose files
        run: |
          scp deploy/lightsail/docker-compose.yml deploy/lightsail/Caddyfile deploy/lightsail/.env \
            "lightsail:${APP_DIR}/"
          ssh lightsail "chmod 600 ${APP_DIR}/.env"
          rm deploy/lightsail/.env

      - name: Login to ECR on the instance
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | ssh lightsail "docker login --username AWS --password-stdin ${ECR_REGISTRY}"

      - name: Pull and restart containers
        run: |
          ssh lightsail "cd ${APP_DIR} \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker image prune -af"

      - name: Wait for health check
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 5 \
              --resolve "${API_DOMAIN}:443:${LIGHTSAIL_HOST}" \
              "https://${API_DOMAIN}/health"; then
              echo
              echo "Healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy"
          ssh lightsail "cd ${APP_DIR} && docker compose ps && docker compose logs --tail 100"
          exit 1
