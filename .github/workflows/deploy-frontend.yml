name: Deploy Chess Frontend

on:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - "cdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chess-frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: chess-app-frontend-stack
  CDK_DIR: cdk

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install CDK CLI
        run: npm install --global aws-cdk

      - name: Install infrastructure dependencies
        working-directory: ${{ env.CDK_DIR }}
        run: npm ci

      - name: CDK synth
        working-directory: ${{ env.CDK_DIR }}
        run: npx cdk synth ${{ env.STACK_NAME }}

      - name: CDK deploy
        working-directory: ${{ env.CDK_DIR }}
        run: |
          npx cdk deploy ${{ env.STACK_NAME }} \
            --require-approval never