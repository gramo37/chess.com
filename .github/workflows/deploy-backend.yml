name: Deploy Chess Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "apps/ws/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: chess-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "526955697352"
  ECR_REGISTRY: 526955697352.dkr.ecr.us-east-1.amazonaws.com
  API_REPOSITORY: chess/backend
  WS_REPOSITORY: chess/ws
  EC2_HOST: 54.227.33.240
  EC2_USER: ec2-user
  EC2_APP_DIR: /home/ec2-user/chess
  COMPOSE_FILE: docker-compose.yml

jobs:
  deploy:
    name: Build images and deploy EC2
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API and WebSocket images
        id: images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          api_image="${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"
          ws_image="${ECR_REGISTRY}/${WS_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --tag "${api_image}" \
            --tag "${ECR_REGISTRY}/${API_REPOSITORY}:latest" \
            apps/backend

          docker build \
            --tag "${ws_image}" \
            --tag "${ECR_REGISTRY}/${WS_REPOSITORY}:latest" \
            apps/ws

          docker push "${api_image}"
          docker push "${ECR_REGISTRY}/${API_REPOSITORY}:latest"
          docker push "${ws_image}"
          docker push "${ECR_REGISTRY}/${WS_REPOSITORY}:latest"

          echo "api_image=${api_image}" >> "$GITHUB_OUTPUT"
          echo "ws_image=${ws_image}" >> "$GITHUB_OUTPUT"

      - name: Deploy containers on EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          WS_IMAGE: ${{ steps.images.outputs.ws_image }}
        run: |
          if [ -z "${SSH_KEY}" ]; then
            echo "EC2_SSH_KEY is not set. Add the EC2 private key as a repository secret."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

          ecr_password="$(aws ecr get-login-password --region "${AWS_REGION}")"
          echo "::add-mask::${ecr_password}"

          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "ECR_PASSWORD='${ecr_password}' ECR_REGISTRY='${ECR_REGISTRY}' API_IMAGE='${API_IMAGE}' WS_IMAGE='${WS_IMAGE}' APP_DIR='${EC2_APP_DIR}' COMPOSE_FILE='${COMPOSE_FILE}' bash -s" <<EOF
          set -euo pipefail
          cd "\${APP_DIR}"

          printf '%s' "\${ECR_PASSWORD}" | docker login --username AWS --password-stdin "\${ECR_REGISTRY}"

          docker compose -f "\${COMPOSE_FILE}" stop backend ws
          docker compose -f "\${COMPOSE_FILE}" rm -f backend ws
          docker image rm -f "\${API_IMAGE}" "\${ECR_REGISTRY}/chess/backend:latest" \
            "\${WS_IMAGE}" "\${ECR_REGISTRY}/chess/ws:latest" || true

          docker compose -f "\${COMPOSE_FILE}" pull backend ws
          docker compose -f "\${COMPOSE_FILE}" up -d backend ws
          docker compose -f "\${COMPOSE_FILE}" ps
          EOF
